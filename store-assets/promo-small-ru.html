<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:440px;height:280px;overflow:hidden}
  .wrap{width:440px;height:280px;display:flex;align-items:center;position:relative;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(500px 320px at 20% 30%,#fff8ee 0%,#ffedcf 60%,#ffdca6 100%)}
  .pill{display:inline-flex;align-items:center;gap:12px;background:#fff;border:1px solid #ffddb0;
    border-radius:999px;padding:10px 20px 10px 12px;font-size:20px;font-weight:600;color:#8a5200}
  .logo{width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,#FFB020,#F67C00);display:flex;align-items:center;justify-content:center}
  h1{font-weight:800;color:#7c4a03;letter-spacing:-1px}
  h1 .hl{color:#F67C00}
  p.sub{color:#a5641a;font-weight:500}
  .blob{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 40%,#ffcf8a 0%,#ff9f45 60%,#f67c00 100%);opacity:.45;filter:blur(2px)}
  .mascot{position:relative}
  .chips{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.78);border:1px solid #ffddb0;
    border-radius:14px;padding:14px 20px;font-size:22px;font-weight:600;color:#8a5200}
  .card{background:#fff;border:1px solid #ffddb0;border-radius:20px;padding:22px 26px;box-shadow:0 18px 40px rgba(200,110,0,.14);max-width:560px}
  .badge{background:#dcfce7;color:#15803d;font-weight:700;font-size:22px;padding:8px 16px;border-radius:12px}
  .meta{color:#64748b;font-size:20px;font-weight:500}
  .pc{display:flex;gap:14px;margin-top:18px}
  .col{flex:1;border-radius:14px;padding:14px 16px;font-size:20px;font-weight:600}
  .g{background:#ecfdf5;color:#047857}.a{background:#fff7ed;color:#b45309}
  .col small{display:block;font-weight:500;font-size:16px;opacity:.85;margin-top:4px}
  .plans{display:flex;gap:18px;margin-top:34px}
  .plan{flex:1;border-radius:20px;padding:24px 26px;box-shadow:0 16px 36px rgba(200,110,0,.14)}
  .free{background:#fff;border:1px solid #ffddb0}
  .pro{background:linear-gradient(180deg,#FFB020,#F67C00);color:#fff}
  .pt{font-size:26px;font-weight:800}.free .pt{color:#8a5200}
  .pl{margin-top:12px;font-size:20px;font-weight:500;line-height:1.5}
  .free .pl{color:#475569}.pro .pl{color:#fff2df}
